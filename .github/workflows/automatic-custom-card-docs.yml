name: "Automatic custom_cards docs"

on:
  push:
    branches: ["main"]
    paths:
      - "editable-cards/src/cards/custom/*/README.md"
      - "editable-cards/src/cards/chips/community/*/README.md"
      - "docs/"

jobs:
  docit:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
        with:
          fetch-depth: 0
      - name: "Copy and rename README.md files"
        run: |
          mkdir -p ./docs/usage/custom_cards

          # Lit custom cards → docs/usage/custom_cards/custom_card_<underscored>.md
          for readme in ./editable-cards/src/cards/custom/*/README.md; do
            [ -f "$readme" ] || continue
            foldername=$(basename "$(dirname "$readme")")
            docname="custom_card_${foldername//-/_}"
            cp "$readme" "./docs/usage/custom_cards/${docname}.md"
          done

          # Community chips / templates → custom_chip_* or custom_template_*
          for readme in ./editable-cards/src/cards/chips/community/*/README.md; do
            [ -f "$readme" ] || continue
            foldername=$(basename "$(dirname "$readme")")
            underscored="${foldername//-/_}"
            if [ "$foldername" = "shogun160-battery-info" ]; then
              docname="custom_template_${underscored}"
            else
              docname="custom_chip_${underscored}"
            fi
            cp "$readme" "./docs/usage/custom_cards/${docname}.md"
          done
      - name: "Find and replace asset paths"
        uses: "jacobtomlinson/gha-find-replace@v3"
        with:
          find: "../../docs/assets/img"
          replace: "../../assets/img"
          include: "docs/usage/custom_cards/**"
          regex: true
      - name: "Create Pull Request"
        uses: "peter-evans/create-pull-request@v8"
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          branch: "automated_custom_card_docs"
          delete-branch: true
          commit-message: "Update docs"
          committer: "GitHub <noreply@github.com>"
          title: "[Action] Update custom_cards docs"
          labels: ":memo: documentation"
          body: |
            Update custom_cards docs due to latest changes.
