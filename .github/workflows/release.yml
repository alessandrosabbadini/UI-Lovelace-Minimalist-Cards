---
name: "Release"

on:
  release:
    types: ["published"]

permissions:
  contents: write

jobs:
  publish_plugin:
    name: "Build & upload Lovelace plugin"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v6"

      - name: "Setup Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "editable-cards/package-lock.json"

      - name: "Build HACS plugin"
        run: "bash scripts/build-hacs.sh"

      - name: "Upload ulm-editable-cards.js"
        uses: "svenstaro/upload-release-action@2.11.5"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          file: "dist/ulm-editable-cards.js"
          asset_name: "ulm-editable-cards.js"
          tag: "${{ github.ref }}"
          overwrite: true

      - name: "Upload ulm-editable-cards.js.gz"
        uses: "svenstaro/upload-release-action@2.11.5"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          file: "dist/ulm-editable-cards.js.gz"
          asset_name: "ulm-editable-cards.js.gz"
          tag: "${{ github.ref }}"
          overwrite: true
