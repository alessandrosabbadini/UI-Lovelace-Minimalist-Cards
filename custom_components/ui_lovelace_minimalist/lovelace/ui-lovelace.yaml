---
title: "UI Lovelace Minimalist (Editable Cards)"
theme: "minimalist-desktop"
background: "var(--background-image)"
views:
  - title: "Example View"
    path: 0
    icon: "mdi:flower"
    cards:
      - type: "custom:ulm-welcome-card"
        name: "Welcome"
        label: "UI-editable Minimalist cards"
        weather_entity: "weather.home"
      - type: "custom:ulm-title-card"
        name: "Lights"
        label: "Configured from the Home Assistant UI editor"
      - type: "custom:ulm-light-card"
        entity: "light.demo_light"
        enable_slider: true
        enable_color: true
      - type: "custom:ulm-title-card"
        name: "People"
      - type: "custom:ulm-person-card"
        entity: "person.demo"
        use_entity_picture: true
      - type: "custom:ulm-title-card"
        name: "Climate & Covers"
      - type: "grid"
        columns: 2
        square: false
        cards:
          - type: "custom:ulm-thermostat-card"
            entity: "climate.demo"
            enable_controls: true
          - type: "custom:ulm-cover-card"
            entity: "cover.demo"
            enable_controls: true
            enable_slider: true
